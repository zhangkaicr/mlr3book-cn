<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<script>
(function(){
  var saved = localStorage.getItem("mlr3-theme");
  if (saved === null) saved = "dark";
  document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<style>
:root {
  --bg: #1e2228; --fg: #d8dee4; --muted: #9aa4b0;
  --panel: #262c34; --panel2: #2e3540; --border: #3a4350;
  --accent: #4ea1ff; --accent2: #8f7ae6;
  --code-bg: #161a20; --code-fg: #d8dee4;
  --note-bg: #2a3450; --note-border: #5a7fff;
  --callout-bg: #2b3826; --callout-border: #6bbf59;
  --table-head: #2e3540; --table-row: #262c34; --link: #6cb0ff;
  --h-border: #3a4350;
}
[data-theme="light"] {
  --bg: #f7f8fa; --fg: #24292f; --muted: #57606a;
  --panel: #ffffff; --panel2: #f0f2f5; --border: #d9dee3;
  --accent: #0969da; --accent2: #8250df;
  --code-bg: #f3f4f6; --code-fg: #24292f;
  --note-bg: #eef2ff; --note-border: #5a7fff;
  --callout-bg: #eff7ec; --callout-border: #6bbf59;
  --table-head: #eef1f4; --table-row: #ffffff; --link: #0969da;
  --h-border: #d9dee3;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  line-height: 1.78; font-size: 16px;
  transition: background .2s, color .2s;
}
.container { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }
/* 顶栏 */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px 20px;
}
.topbar .brand { font-weight: 600; font-size: 15px; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.topbar .brand .logo { color: var(--accent); }
.topbar .right { display: flex; align-items: center; gap: 10px; }
.topbar .home-link { color: var(--muted); font-size: 13px; text-decoration: none; }
.topbar .home-link:hover { color: var(--accent); }
.theme-toggle {
  background: var(--panel2); border: 1px solid var(--border); color: var(--fg);
  border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--accent); }
/* 章头 */
.header-block { padding: 34px 0 12px; border-bottom: 1px solid var(--h-border); margin-bottom: 26px; }
.header-block .part { color: var(--accent2); font-size: 13px; letter-spacing: .08em; margin-bottom: 6px; }
.header-block h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.35; }
.header-block .subtitle { color: var(--muted); font-size: 14px; }
/* 章节导航 */
.chnav { display: flex; justify-content: space-between; gap: 12px; margin: 30px 0 6px; flex-wrap: wrap; }
.chnav a {
  background: var(--panel); border: 1px solid var(--border); color: var(--fg);
  text-decoration: none; font-size: 14px; padding: 10px 16px; border-radius: 8px;
  max-width: 46%; display: block;
}
.chnav a:hover { border-color: var(--accent); color: var(--accent); }
.chnav .dir { color: var(--muted); font-size: 12px; display: block; }
.chnav .ch { font-weight: 600; }
.chnav a.disabled { opacity: .4; pointer-events: none; }
/* 正文 */
main { padding: 0 0 20px; }
main h1 { font-size: 26px; margin: 40px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--h-border); }
main h2 { font-size: 22px; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--h-border); }
main h3 { font-size: 18px; margin: 28px 0 10px; }
main h4 { font-size: 16px; margin: 22px 0 8px; color: var(--accent); }
main p { margin: 10px 0; }
main a { color: var(--link); text-decoration: none; }
main a:hover { text-decoration: underline; }
main strong { font-weight: 600; }
main ul, main ol { padding-left: 26px; }
main li { margin: 5px 0; }
main blockquote {
  margin: 12px 0; padding: 10px 16px; border-left: 4px solid var(--border);
  background: var(--panel2); color: var(--muted); border-radius: 0 6px 6px 0;
}
main hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
main img { max-width: 100%; height: auto; display: block; margin: 10px auto; border-radius: 6px; }
main table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
main th { background: var(--table-head); font-weight: 600; }
main th, main td { border: 1px solid var(--border); padding: 7px 11px; }
main tr:nth-child(even) td { background: var(--table-row); }
/* 代码 */
pre {
  background: var(--code-bg); color: var(--code-fg);
  padding: 14px 16px; border-radius: 8px; overflow-x: auto;
  border: 1px solid var(--border); font-size: 13.5px; line-height: 1.6;
}
pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
code {
  font-family: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  background: var(--panel2); color: var(--accent);
  padding: 2px 5px; border-radius: 4px; font-size: 13.5px;
}
pre code { background: none; color: var(--code-fg); padding: 0; }
/* 代码块容器（Quarto 结构） */
.sourceCode { margin: 14px 0; }
.sourceCode pre { margin: 0; }
/* 输出块 */
.cell { margin: 6px 0; }
.cell-output { margin: 0 0 6px; }
.cell-output pre { background: var(--panel2); border-style: dashed; }
.cell-output-stderr { border-color: #d29922; }
.cell-output-stdout pre { border-color: var(--border); }
/* figure */
figure { margin: 18px 0; text-align: center; }
figure img { margin: 0 auto; }
figcaption, .caption { color: var(--muted); font-size: 13px; margin-top: 6px; text-align: center; }
.quarto-float { margin: 18px 0; }
.quarto-figure { margin: 18px 0; text-align: center; }
/* 背景与解释（译者注）框 */
.bg-note {
  background: var(--note-bg); border: 1px solid var(--note-border);
  border-radius: 8px; padding: 14px 18px; margin: 18px 0;
  font-size: 15px;
}
.bg-note p { margin: 6px 0; }
.bg-note .bg-title { font-weight: 600; color: var(--accent); }
/* 原书 callout 提示框 */
.callout {
  border-radius: 8px; padding: 12px 18px; margin: 16px 0;
  border-left: 5px solid var(--accent); background: var(--panel2);
}
.callout-tip { border-left-color: #6bbf59; }
.callout-note { border-left-color: var(--accent); }
.callout-warning { border-left-color: #d29922; }
.callout-important { border-left-color: #e05d5d; }
.callout-header { font-weight: 600; margin-bottom: 4px; }
.callout-title-container { display: inline; }
.callout-body p { margin: 6px 0; }
.callout-icon-container { display: none; }
/* 脚注 */
.footnote-ref { font-size: 12px; vertical-align: super; }
/* 页脚 */
.footer {
  margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 13px; text-align: center;
}
.footer .lic { margin-top: 6px; font-size: 12px; }
/* 表格滚动 */
main table { display: block; overflow-x: auto; }
/* banner 样式（原书 callout 可能以其他名目出现） */
[class*="callout"] > p:first-child { margin-top: 4px; }
</style>
<script>
function toggleTheme(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("mlr3-theme", next);
}
</script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="__HOME__"><span class="logo">&#9638;</span> mlr3 中文版</a>
  <div class="right">
    <a class="home-link" href="__HOME__">目录</a>
    <button class="theme-toggle" onclick="toggleTheme()">&#9681; 主题</button>
  </div>
</div>
<div class="container">
  <div class="header-block">
    <div class="part">__PART__</div>
    <h1>__TITLE__</h1>
    <div class="subtitle">__SUBTITLE__</div>
  </div>
  <main>
__CONTENT__
  </main>
  <nav class="chnav">
    <a class="__PREV_CLASS__" href="__PREV_HREF__"><span class="dir">上一章</span><span class="ch">__PREV_TITLE__</span></a>
    <a class="__NEXT_CLASS__" href="__NEXT_HREF__"><span class="dir">下一章</span><span class="ch">__NEXT_TITLE__</span></a>
  </nav>
  <div class="footer">
    <div>《Applied Machine Learning Using mlr3 in R》中文译本 · 非官方翻译</div>

  </div>
</div>

</html>
